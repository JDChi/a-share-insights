[project]
name = "ashare-insights"
version = "1.1.0"
description = "Local annual report catalog, text RAG and retrieval evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "pypdf==6.10.0",
  "sentence-transformers==5.7.0",
  "torch==2.14.1",
  "transformers==5.20.2",
  "llama-index-core==0.14.25",
  "llama-index-llms-openai-like>=0.5,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
eval = [
  "ragas==0.4.3",
  # Ragas 0.4 imports legacy VertexAI modules removed by langchain-community 0.4.
  "langchain-community>=0.3.27,<0.4",
  "langchain<1",
  "langchain-core<1",
  "langchain-openai<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashare_insights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
