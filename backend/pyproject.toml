[project]
name = "ashare-insights"
version = "0.1.0"
description = "Local A-share annual report catalog and PDF service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashare_insights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
